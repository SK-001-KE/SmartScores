<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recorded Scores - SmartScores</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <nav class="navbar">
    <h2>SmartScores</h2>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a class="active" href="recorded-scores.html">Recorded Scores</a></li>
    </ul>
  </nav>

  <main class="container">
    <h1>Recorded Scores</h1>

    <input type="text" id="searchInput" placeholder="Search student, subject, class..." class="search-bar" />

    <table class="records-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Teacher</th>
          <th>Class</th>
          <th>Subject</th>
          <th>Student</th>
          <th>Score</th>
          <th>Rubric</th>
        </tr>
      </thead>
      <tbody id="recordsBody"></tbody>
    </table>

    <div class="rubric-key">
      <h3>Rubric Key</h3>
      <ul>
        <li><span class="badge ee1">EE1</span> 90-99</li>
        <li><span class="badge ee2">EE2</span> 75-89</li>
        <li><span class="badge me1">ME1</span> 58-74</li>
        <li><span class="badge me2">ME2</span> 41-57</li>
        <li><span class="badge ae1">AE1</span> 31-40</li>
        <li><span class="badge ae2">AE2</span> 21-30</li>
        <li><span class="badge be1">BE1</span> 11-20</li>
        <li><span class="badge be2">BE2</span> 0-10</li>
      </ul>
    </div>

  </main>
</body>
</html>
