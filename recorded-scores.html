<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartScores - Recorded Scores</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
 <script src="app.js"></script>
 <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Same header/nav -->
  <header>
  <h1><img src="icon-192x192.png" alt="" style="height:40px;vertical-align:middle;margin-right:10px;border-radius:8px;"> SmartScores</h1>
</header>
<nav>
  <a href="index.html">Dashboard</a>
  <a href="data-entry.html">Data Entry</a>
  <a href="recorded-scores.html">Records</a>
  <a href="averages-insights.html">Insights</a>
  <a href="set-targets.html">Targets</a>
</nav>
  <div class="content">
    <h2>Recorded Scores</h2>
  <input type="text" id="searchInput" placeholder="🔍 Search records (teacher, subject, grade...)"
         onkeyup="filterRecords()" style="width:100%; padding:12px; margin:15px 0; border:2px solid #ddd; border-radius:6px; font-size:16px;" />
   
    <div class="settings-container" style="margin:20px 0;text-align:center;">
      <label>Auto Delete Old Data:</label>
      <select id="autoDeleteSetting" style="margin:0 10px;padding:5px;">
        <option value="none">Keep All</option>
        <option value="1" selected>Keep 1 Year</option>
        <option value="2">Keep 2 Years</option>
      </select>
      <button onclick="runAutoDelete()" class="btn">Run Auto Delete</button>
    </div>
   <table id="recordsTable">
  <thead>
    <tr>
      <th onclick="sortRecords(0)">Teacher</th>
      <th onclick="sortRecords(1)">Subject</th>
      <th onclick="sortRecords(2)">Grade</th>
      <th onclick="sortRecords(3)">Stream</th>
      <th onclick="sortRecords(4)">Term</th>
      <th onclick="sortRecords(5)">Exam</th>
      <th onclick="sortRecords(6)">Year</th>
      <th onclick="sortRecords(7)">Mean</th>
      <th onclick="sortRecords(8)">Target</th>
      <th onclick="sortRecords(9)">Deviation</th>
      <th>Rubric</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
    <div style="text-align:center;margin:20px;">
  <button onclick="exportToExcel()" class="btn">Export Excel</button>
  <button onclick="exportBackup()" class="btn">Backup JSON</button>
  <button onclick="clearAllData()" class="btn btn-danger">Clear All</button>
</div>
  </div>
</body>
</html>
