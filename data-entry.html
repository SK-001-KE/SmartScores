<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SmartScores - Data Entry</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<script src="auth.js" defer></script>
<script src="app.js" defer></script>
</head>

<body onload="loadTheme()">

<button id="sidebarToggle" class="menu-toggle" onclick="toggleSidebar()">Menu</button>

<aside id="sidebarMenu" class="sidebar closed">
  <a href="index.html">Dashboard</a>
  <a href="data-entry.html" class="active">Data Entry</a>
  <a href="recorded-scores.html">Recorded Scores</a>
  <a href="averages-insights.html">Averages & Insights</a>
  <a href="set-targets.html">Set Targets</a>
  <button onclick="logout()" class="logout-btn">Logout</button>
</aside>

<button onclick="toggleDarkMode()" class="floating-top-btn">🌙</button>

<header>
<h1>SmartScores</h1>
<p>Record Student Mean Scores</p>
</header>

<div class="content content-with-sidebar">

<form id="dataEntryForm" class="form-box">

<label>Subject</label>
<select id="subject" required>
  <option value="">Select Subject</option>
  <option>Math</option><option>English</option>
  <option>Kiswahili</option><option>Science</option>
  <option>Social Studies</option>
</select>

<label>Grade</label>
<select id="grade" required>
  <option value="">Select Grade</option>
  <option>4</option><option>5</option><option>6</option><option>7</option><option>8</option>
</select>

<label>Stream</label>
<input id="stream" placeholder="e.g. North" required>

<label>Term</label>
<select id="term" required>
  <option value="">Select Term</option>
  <option>Term 1</option><option>Term 2</option><option>Term 3</option>
</select>

<label>Opener Mean</label>
<input type="number" id="opener" required>

<label>Mid Term Mean</label>
input type="number" id="midterm" required>

<label>End Term Mean</label>
<input type="number" id="endterm" required>

<button class="btn-maroon full">Save Record</button>

</form>

</div>
<footer>SmartScores © 2025</footer>
</body>
</html>
