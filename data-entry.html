<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartScores - Data Entry</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icon-192x192.png" />

  <link rel="stylesheet" href="style.css" />

  <!-- Scripts -->
  <script src="auth.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>
<!-- TOP RIGHT BUTTONS -->
<div class="top-buttons">
  <button onclick="toggleDarkMode()" class="btn-blue small">Dark Mode</button>
  <button onclick="logout()" class="btn-red small">Logout</button>
</div>

<header>
  <h1>
    <img src="icon-192x192.png" alt="SmartScores" class="logo-small">
    SmartScores
  </h1>
  <p>Data Entry</p>
</header>

<nav>
  <a href="index.html">Dashboard</a>
  <a href="data-entry.html" class="active">Data Entry</a>
  <a href="recorded-scores.html">Recorded Scores</a>
  <a href="averages-insights.html">Averages & Insights</a>
  <a href="set-targets.html">Set Targets</a>
</nav>

<div class="content">
  <h2>Enter Teacher Mean Scores</h2>
  <form id="dataEntryForm">

    <div class="form-group">
      <label for="teacherName">Teacher's Name</label>
      <input type="text" id="teacherName" placeholder="Enter Teacher's Name" required />
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <select id="subject" required>
        <option value="">--Select Subject--</option>
        <option>Mathematics</option><option>English</option><option>Kiswahili</option>
        <option>Science</option><option>Agriculture and Nutrition</option>
        <option>Creative Arts</option><option>Social Studies</option>
        <option>CRE</option><option>Pre-Technical Studies</option>
      </select>
    </div>

    <div class="form-group">
      <label for="grade">Grade</label>
      <select id="grade" required>
        <option value="">--Select Grade--</option>
        <option>4</option><option>5</option><option>6</option>
        <option>7</option><option>8</option><option>9</option>
      </select>
    </div>

    <div class="form-group">
      <label for="stream">Stream</label>
      <select id="stream" required>
        <option value="">--Select Stream--</option>
        <option>Faith</option><option>Glory</option><option>Joy</option>
        <option>Love</option><option>Peace</option><option>Unity</option>
      </select>
    </div>

    <div class="form-group">
      <label for="term">Term</label>
      <select id="term" required>
        <option value="">--Select Term--</option>
        <option>Term 1</option><option>Term 2</option><option>Term 3</option>
      </select>
    </div>

    <div class="form-group">
      <label for="examType">Exam Type</label>
      <select id="examType" required>
        <option value="">--Select Exam Type--</option>
        <option>Opener Exam</option>
        <option>Mid Term Exam</option>
        <option>End Term Exam</option>
      </select>
    </div>

    <div class="form-group">
      <label for="year">Year</label>
      <input type="number" id="year" placeholder="Auto-filled" min="2000" max="2100" required />
    </div>

    <div class="form-group">
      <label for="meanScore">Mean Score</label>
      <input type="number" id="meanScore" placeholder="Enter Mean Score" min="0" max="100" step="0.1" required />
    </div>

    <button type="submit" class="btn">Save Record</button>
  </form>
</div>

<footer>SmartScores v2.9.6 © Kariuki 2025</footer>

<!-- RUBRIC KEY BUTTON -->
<div id="rubricBtn" class="floating-btn">Rubric Key</div>

<!-- RUBRIC PANEL -->
<div id="rubricPanel" class="rubric-panel">
  <strong>Rubric Key</strong><br><br>
  <div class="rubric EE1">EE1: 90–99</div>
  <div class="rubric EE2">EE2: 75–89</div>
  <div class="rubric ME1">ME1: 58–74</div>
  <div class="rubric ME2">ME2: 41–57</div>
  <div class="rubric AE1">AE1: 31–40</div>
  <div class="rubric AE2">AE2: 21–30</div>
  <div class="rubric BE1">BE1: 11–20</div>
  <div class="rubric BE2">BE2: 0–10</div>
</div>

<script>
document.getElementById("rubricBtn").onclick = () => {
  const panel = document.getElementById("rubricPanel");
  panel.style.display = panel.style.display === "block" ? "none" : "block";
};

// Auto-fill current year
document.getElementById("year").value = new Date().getFullYear();
</script>

</body>
</html>
