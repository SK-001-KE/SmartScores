<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartScores - Set Targets</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icon-192x192.png" />
  <script src="app.js"></script>
 <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div style="position:fixed;top:10px;right:10px;z-index:1000;">
    <button onclick="toggleDarkMode()" style="background:var(--blue);color:white;padding:8px 12px;border:none;border-radius:20px;cursor:pointer;">Dark Mode</button>
  </div>
  <header>
    <h1>
      <img src="icon-192x192.png" alt="SmartScores" style="height:40px;vertical-align:middle;margin-right:10px;border-radius:8px;">
      SmartScores
    </h1>
    <p>Set Exam Targets</p>
  </header>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="data-entry.html">Data Entry</a>
    <a href="recorded-scores.html">Recorded Scores</a>
    <a href="averages-insights.html">Averages & Insights</a>
    <a href="set-targets.html" class="active">Set Targets</a>
  </nav>
  <div class="content">
    <h2>Set Target Mean Score</h2>

    <!-- FIXED: ONE FORM, WRAPS ALL INPUTS + BUTTON -->
    <form id="setTargetsForm">
      <div class="form-group">
        <label for="targetSubject">Subject</label>
        <select id="targetSubject" required>
          <option value="">--Select Subject--</option>
          <option value="Mathematics">Mathematics</option>
          <option value="English">English</option>
          <option value="Kiswahili">Kiswahili</option>
          <option value="Science">Science</option>
          <option value="Agriculture and Nutrition">Agriculture and Nutrition</option>
          <option value="Creative Arts">Creative Arts</option>
          <option value="Social Studies">Social Studies</option>
          <option value="CRE">CRE</option>
          <option value="Pre-Technical Studies">Pre-Technical Studies</option>
        </select>
      </div>
      <div class="form-group">
        <label for="targetGrade">Grade</label>
        <select id="targetGrade" required>
          <option value="">--Select Grade--</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
        </select>
      </div>
      <div class="form-group">
        <label for="targetStream">Stream</label>
        <select id="targetStream" required>
          <option value="">--Select Stream--</option>
          <option value="Faith">Faith</option>
          <option value="Glory">Glory</option>
          <option value="Joy">Joy</option>
          <option value="Love">Love</option>
          <option value="Peace">Peace</option>
          <option value="Unity">Unity</option>
        </select>
      </div>
      <div class="form-group">
        <label for="targetTerm">Term</label>
        <select id="targetTerm" required>
          <option value="">--Select Term--</option>
          <option value="Term 1">Term 1</option>
          <option value="Term 2">Term 2</option>
          <option value="Term 3">Term 3</option>
        </select>
      </div>
      <div class="form-group">
        <label for="targetExamType">Exam Type</label>
        <select id="targetExamType" required>
          <option value="">--Select Exam Type--</option>
          <option value="Opener Exam">Opener Exam</option>
          <option value="Mid Term Exam">Mid Term Exam</option>
          <option value="End Term Exam">End Term Exam</option>
        </select>
      </div>
      <div class="form-group">
        <label for="targetScore">Target Mean Score (%)</label>
        <input type="number" id="targetScore" min="0" max="100" step="0.1" placeholder="e.g. 75" required />
      </div>
      <button type="submit" class="btn">Save Target</button>
    </form>

    <h2 style="margin-top:40px;">Current Targets</h2>
    <table id="targetsTable">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Grade</th>
          <th>Stream</th>
          <th>Term</th>
          <th>Exam Type</th>
          <th>Target</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>SmartScores v2.9.11 © Kariuki 2025</footer>
</body>
</html>
