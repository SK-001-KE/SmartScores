<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartScores - Sign Up</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./icon-192x192.png" />
  <link rel="stylesheet" href="./style.css" />
  
  <script src="./auth.js" defer></script> 
  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./firebase-auth.js"></script>
  <script type="module" src="./firebase-sync.js"></script>
  
  <style>
    .btn-google {
      background: white;
      color: #333;
      border: 2px solid #ddd;
      font-weight: 600;
    }

    .btn-google:hover {
      background: #f8f9fa;
      border-color: #ccc;
      transform: translateY(-2px);
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      position: relative;
      color: #666;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      background: var(--bg);
      padding: 0 15px;
      position: relative;
    }

    .form-options {
      margin: 20px 0;
      padding: 15px;
      background: rgba(139, 0, 0, 0.05);
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-weight: 600;
      color: var(--text);
    }

    .form-options input[type="checkbox"] {
      width: auto;
      transform: scale(1.2);
    }

    .form-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .form-actions {
        gap: 10px;
      }
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .custom-alert {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      z-index: 10000;
      max-width: 300px;
      box-shadow: var(--shadow);
      animation: slideIn 0.3s ease;
    }

    .alert-success { background: #10B981; }
    .alert-error { background: #EF4444; }
    .alert-warning { background: #F59E0B; }
    .alert-info { background: #3B82F6; }
  </style>
</head>
<body>
  <button onclick="toggleDarkMode()" class="floating-top-btn">🌙 Dark Mode</button>

  <header>
    <h1>
      <img src="./icon-192x192.png" class="logo-small" style="height:40px;margin-right:10px;border-radius:8px;">
      SmartScores
    </h1>
    <p>Teacher Performance Tracker</p>
  </header>

  <main class="content centered">
  <div class="login-container">
    <h2>✍️ New Teacher Registration</h2>
    <p class="login-subtitle">Create an account to save your data to the cloud.</p>
    
    <form id="cloudRegistrationForm" class="form-box">
      
      <div class="form-group">
        <label>First Name (Required for Reports)</label>
        <input type="text" id="firstName" required placeholder="John">
      </div>

      <div class="form-group">
        <label>Last Name (Required for Reports)</label>
        <input type="text" id="lastName" required placeholder="Doe">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="your.email@school.com" onblur="this.value = this.value.toLowerCase().trim()">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
  type="text" 
  id="password" 
  required 
  placeholder="Create a 6-digit PIN" 
  minlength="6" 
  maxlength="6" 
  pattern="\d{6}"
  inputmode="numeric"
>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary full">✨ Create Cloud Account</button>
      </div>
    </form>
    
    <div class="form-actions" style="margin-top: 15px;">
      <button type="button" onclick="window.location.href='./login.html'" class="btn btn-secondary full">
        ⬅️ Already Registered? **Sign In**
      </button>
    </div>

    <p class="hint text-center" style="margin-top: 20px;">Your name is used for personalized reports and data tracking.</p>

  </div>
</main>

<script type="module">
  import firebaseAuth from './firebase-auth.js';
  import firebaseSync from './firebase-sync.js'; // Ensure this is imported if needed

  function showCustomAlert(message, type = 'info', isHTML = false) {
    const alertBox = document.getElementById('customAlert') || document.createElement('div');
    if (!alertBox.id) {
        alertBox.id = 'customAlert';
        document.body.appendChild(alertBox);
    }
    alertBox.className = `custom-alert alert-${type}`;
    alertBox.innerHTML = isHTML ? message.replace(/\n/g, '<br>') : message;
    alertBox.style.display = 'block';
    setTimeout(() => alertBox.style.display = 'none', 7000); // Longer display for verification message
  }

  function showSignupError(message) { showCustomAlert(message, 'error'); }
  function showSignupSuccess(message, isHTML = false) { showCustomAlert(message, 'success', isHTML); }
  
  // --- START OF HANDLERS FOR BUTTONS/FORM ---
  document.getElementById('cloudRegistrationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const fullName = `${firstName} ${lastName}`.trim();

    if (!firstName || !lastName || !email || !password) {
      showSignupError('Please fill in all fields.');
      return;
    }
    
    // NEW: Password Strength Validation Check
    // NEW: Password Strength Validation Check
const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

if (!passwordRegex.test(password)) {
    showSignupError('Password must be at least 8 characters long and contain one uppercase, one lowercase, one number, and one special character (@$!%*?&).');
    return;
}
    try {
      showCustomAlert('Registering account...', 'info');
      // Pass the name to the registration function
      const result = await firebaseAuth.registerWithEmail(email, password, fullName); 

      if (result.success) {
        // Handle successful creation and SENT verification email
        const message = `🎉 Success! Account created.
          
          A verification link has been sent to **${email}**. 
          
          Please click the link to confirm your email. You will be redirected to the login page.`;
        
        showSignupSuccess(message, true); // Show message with HTML
        
        await firebaseAuth.logout(); // Force sign-out so they have to log in again after verification.

        setTimeout(() => {
          window.location.href = './login.html';
        }, 5000); // Redirect after 5 seconds
        
      } else {
        showSignupError(`Registration failed: ${result.error.replace('Firebase: ', '')}`);
      }
    } catch (error) {
      showSignupError('An unexpected error occurred: ' + error.message);
    }
  });

  // REMOVE the handleGoogleSignIn function completely.

  // Auto-focus first name field
  document.addEventListener('DOMContentLoaded', function() {
    const firstNameInput = document.getElementById('firstName');
    if (firstNameInput) {
      setTimeout(() => firstNameInput.focus(), 100);
    }
  });

  // Theme toggle function (retained)
  function toggleDarkMode() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('themeMode', newTheme);
  }

  // Load theme on page load (retained)
  (function() {
    const theme = localStorage.getItem('themeMode') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
  
  // Export functions if needed, but no longer need window.handleGoogleSignIn
</script>
</body>
</html>
