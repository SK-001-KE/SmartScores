<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartScores - Login</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icon-192x192.png" />
  <link rel="stylesheet" href="style.css" />

  <!-- Auto-login + theme loader -->
  <script src="app.js" defer></script>
</head>

<body onload="loadTheme()">

<!-- MOBILE MENU BUTTON (hidden on login, keeps consistency with CSS layout) -->
<button class="menu-toggle" style="display:none;">☰</button>

<!-- SIDEBAR (hidden on login, prevents layout shift) -->
<aside class="sidebar closed" style="display:none;"></aside>

<!-- DARK MODE BUTTON -->
<button onclick="toggleDarkMode()" class="floating-top-btn">🌙</button>

<header>
  <img src="icon-192x192.png" class="logo-small" alt="SmartScores">
  <h1>SmartScores</h1>
  <p>Teacher Performance Tracker</p>
</header>

<div class="content centered">
  <h2>Teacher Login</h2>

  <form id="loginForm" class="form-box">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" placeholder="e.g. John" required>
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" placeholder="e.g. Kariuki" required>
    </div>

    <button type="submit" class="btn full">Login</button>
  </form>

  <p class="hint">Enter your full name to begin tracking performance.</p>
</div>

<footer>SmartScores v2.9.6 © Kariuki 2025</footer>

<script>
const form = document.getElementById('loginForm');
const firstNameInput = document.getElementById('firstName');
const lastNameInput = document.getElementById('lastName');

// Auto-redirect if already logged in
if (localStorage.getItem('teacherFullName')) {
  window.location.href = "index.html";
}

// Restore typed name if page refreshes
const savedName = localStorage.getItem('teacherFullName');
if (savedName) {
  const [first, ...last] = savedName.split(' ');
  firstNameInput.value = first || '';
  lastNameInput.value = last ? last.join(' ') : '';
}

form.addEventListener('submit', e => {
  e.preventDefault();

  const first = firstNameInput.value.trim();
  const last = lastNameInput.value.trim();
  if (!first || !last) return alert("Enter both First & Last Name");

  localStorage.setItem('teacherFullName', `${first} ${last}`);
  window.location.href = "index.html";
});

firstNameInput.focus();
</script>

</body>
</html>
