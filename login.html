<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartScores - Login</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />

  <!-- LOAD app.js FIRST – NO defer -->
  <script src="app.js"></script>
</head>
<body>
  <!-- DARK MODE TOGGLE -->
  <div style="position:fixed;top:10px;right:10px;z-index:1000;">
    <button onclick="toggleDarkMode()" style="background:var(--blue);color:white;padding:8px 12px;border:none;border-radius:20px;cursor:pointer;font-size:0.9rem;">
      Dark Mode
    </button>
  </div>

  <header>
    <h1>
      <img src="icon-192x192.png" alt="SmartScores" style="height:40px;vertical-align:middle;margin-right:10px;border-radius:8px;">
      SmartScores
    </h1>
    <p>Teacher Performance Tracker</p>
  </header>

   <nav>
    <a href="index.html">Dashboard</a>
    <a href="data-entry.html" class="active">Data Entry</a>
    <a href="recorded-scores.html">Recorded Scores</a>
    <a href="averages-insights.html">Averages & Insights</a>
    <a href="set-targets.html">Set Targets</a>
  </nav>

  <div class="content">
    <h2 style="margin-bottom:20px;">Teacher Login</h2>
    
    <form id="loginForm" style="max-width:400px;margin:0 auto;">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="e.g. John" required />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="e.g. Kariuki" required />
      </div>

      <button type="submit" class="btn" style="width:100%;padding:14px;font-size:1.1em;">
        Login
      </button>
    </form>

    <p style="margin-top:20px;font-size:0.9em;color:#666;">
      Enter your full name to begin tracking performance.
    </p>
  </div>

  <footer>SmartScores v2.9.60 © Kariuki 2025</footer>

  <!-- INLINE LOGIN SCRIPT – RUNS AFTER app.js -->
  <script>
    // === LOGIN FORM – FIRST + LAST NAME ===
    const form = document.getElementById('loginForm');
    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');

    // Restore saved full name
    const savedName = localStorage.getItem('teacherFullName');
    if (savedName) {
      const [first, ...last] = savedName.split(' ');
      firstNameInput.value = first || '';
      lastNameInput.value = last ? last.join(' ') : '';
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const first = firstNameInput.value.trim();
      const last = lastNameInput.value.trim();
      if (!first || !last) {
        return alert('Please enter both First and Last Name.');
      }
      const fullName = `${first} ${last}`;
      localStorage.setItem('teacherFullName', fullName);
      window.location.href = 'index.html';
    });

    firstNameInput.focus();
  </script>
</body>
</html>
