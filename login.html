<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartScores - Login</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  
  <!-- GLOBAL STYLES -->
  <link rel="stylesheet" href="style.css" />
  
  <script src="app.js" defer></script>
</head>
<body>
  <!-- DARK MODE TOGGLE -->
  <div style="position:fixed;top:10px;right:10px;z-index:1000;">
    <button onclick="toggleDarkMode()" style="background:var(--blue);color:white;padding:8px 12px;border:none;border-radius:20px;cursor:pointer;font-size:0.9rem;">
      Dark Mode
    </button>
  </div>

  <header>
    <h1><img src="icon-192x192.png" alt="" style="height:40px;vertical-align:middle;margin-right:10px;border-radius:8px;"> SmartScores</h1>
    <p>Teacher Performance Tracker</p>
  </header>

  <nav>
    <a href="login.html" class="active">Login</a>
    <a href="index.html">Dashboard</a>
    <a href="data-entry.html">Data Entry</a>
    <a href="recorded-scores.html">Records</a>
    <a href="averages-insights.html">Insights</a>
    <a href="set-targets.html">Targets</a>
  </nav>

  <div class="content">
    <h2 style="margin-bottom:20px;">Teacher Login</h2>
    
    <form id="loginForm" style="max-width:400px;margin:0 auto;">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. John Kariuki" required />
      </div>

      <button type="submit" class="btn" style="width:100%;padding:14px;font-size:1.1em;">
        Login
      </button>
    </form>

    <p style="margin-top:25px;font-size:0.9em;color:#666;">
      Enter your full name to begin tracking performance.
    </p>
  </div>

  <footer>
    SmartScores v2.9.44 © Kariuki 2025
  </footer>

  <script>
    // === LOGIN FORM HANDLER (Inline for login.html only) ===
    const form = document.getElementById('loginForm');
    const input = document.getElementById('fullName');

    // Restore last name
    const savedName = localStorage.getItem('teacherFullName');
    if (savedName) {
      input.value = savedName;
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) {
        alert('Please enter your full name.');
        return;
      }
      localStorage.setItem('teacherFullName', name);
      window.location.href = 'index.html';
    });

    // Auto-focus
    input.focus();
  </script>
</body>
</html>
